<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Engine | Intent-Based Video Discovery</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <span class="badge">Intent Compiler v3.0</span>
            <h1>Pulse Engine</h1>
            <p>Translating user intent into optimized platform queries across YouTube, TikTok, and Instagram.</p>
        </header>

        <section class="search-box">
            <div class="search-input-wrap">
                <input type="text" id="searchInput" placeholder="Try 'paul george sza' or 'kyrie irving dave'..." autocomplete="off">
                <button id="clearBtn" class="clear-btn">&times;</button>
            </div>
            <button id="searchBtn" class="primary-btn">Match & Route</button>
        </section>

        <section id="resultsContainer">
            <h2 id="searchTitle" class="section-title">Select a Platform Route</h2>
            <div id="resultsGrid" class="menu-grid">
                <div class="placeholder-msg">
                    <p>Enter your subject and song/artist combo above to compile optimized search queries.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
