<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Engine | Multi-Platform Discovery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <span class="badge">Search Engine v2.0</span>
            <h1>Pulse Engine</h1>
            <p>Find hyper-specific edits, moods, and audio mashups directly across major platforms.</p>
        </header>

        <section class="search-box">
            <input type="text" id="searchInput" placeholder="Try 'Kyrie Irving Dave edit' or 'moody basketball'..." autocomplete="off">
            <button id="clearBtn" class="clear-btn">&times;</button>
            <button id="searchBtn" class="primary-btn">Explore Platforms</button>
        </section>

        <section id="resultsContainer">
            <h2 id="searchTitle" class="section-title">Select a Platform to Search</h2>
            <div id="resultsGrid" class="menu-grid">
                <!-- Platform cards render here dynamically -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
