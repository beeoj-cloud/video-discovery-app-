<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Driftfind – find the exact edit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>Drift<span>find</span></h1>
    <p class="tagline">Describe the exact edit, meme, mood or sound. We open it in the app you love.</p>

    <div class="bar">
      <input id="searchInput" type="text" placeholder="e.g. marlon zyro slowed edits" autocomplete="off" aria-label="Search for a video">
      <button id="clearBtn" class="clear" aria-label="Clear search">&times;</button>
      <button id="searchBtn" class="go">Search</button>
    </div>

    <div id="examples" class="examples"></div>

    <section id="resultsSection" hidden>
      <h2 id="searchTitle"></h2>
      <div id="understood" class="understood"></div>
      <div id="filters" class="filters"></div>
      <div id="resultsGrid" class="grid"></div>
    </section>

    <p id="status" class="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
